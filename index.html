<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Information Form - Emma Pet Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sec: '#dce0ed', 
                        secDark: '#c5ccdf',
                        primLight: '#8688a1', 
                        prim: '#6e708a', 
                        primDark: '#595b70', 
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c5ccdf; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8688a1; }
        
        .lang-btn { filter: grayscale(100%); opacity: 0.5; transition: all 0.3s ease; cursor: pointer; }
        .lang-btn.active { filter: grayscale(0%); opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden relative">
        
        <!-- Botões de Idioma (Inglês como padrão) -->
        <div class="absolute top-4 right-4 flex gap-3 z-10 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full">
            <button id="btn-pt" class="lang-btn text-2xl" onclick="changeLanguage('pt')" title="Português">🇧🇷</button>
            <button id="btn-en" class="lang-btn active text-2xl" onclick="changeLanguage('en')" title="English">🇺🇸</button>
        </div>

        <div class="bg-prim p-8 pt-12 text-center text-white">
            <h1 class="text-3xl font-bold flex items-center justify-center gap-3">
                Emma Pet Care <span class="text-4xl">🐾</span>
            </h1>
            <p class="mt-2 text-sec text-lg" data-i18n="title">Pet Information Sheet</p>
            <p class="text-sm mt-1 text-sec opacity-90" data-i18n="subtitle">Please fill out the details below so we can take the best possible care of your best friend!</p>
        </div>

        <!-- 👇 O LINK DO MAKE.COM FICA AQUI 👇 -->
        <form action="https://hook.us2.make.com/jks5ehkl7qg724v3jubdjx77fjh145jj" method="POST" class="p-6 md:p-10 space-y-8">
            
            <input type="hidden" name="Assunto do Email" value="New Pet Information Sheet Filled! 🐾" data-i18n-val="subject">
            
            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec1">
                    📋 Basic Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_dog_name">Dog Name</label>
                        <!-- O atributo 'name' está trancado em Português para o Make funcionar -->
                        <input type="text" name="Nome do Cachorro" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_dog_name" placeholder="Dog Name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_owner_name">Owner Name</label>
                        <input type="text" name="Nome do Tutor" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_owner_name" placeholder="Yout Name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_dates">Dates of Stay</label>
                        <input type="text" name="Datas da Estadia" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_dates" placeholder="Ex: 05/26/2026 – 06/07/2026">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_phone">Owner Phone</label>
                        <input type="tel" name="Telefone do Tutor" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_phone" placeholder="(555) 555-5555">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec2">
                    🥣 Feeding Routine
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_feed">What does the dog eat and when?</label>
                        <textarea name="Rotina de Alimentação" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all resize-y" data-i18n-ph="ph_feed" placeholder="Ex: Breakfast between 6:00 and 7:00 (pre-portioned food)..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_allergy">Does he/she have any food allergies or sensitivities?</label>
                        <input type="text" name="Alergias Alimentares" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_allergy" placeholder="If none, write 'None'">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec3">
                    🚽 Potty Routine
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_potty_sched">What is the potty schedule?</label>
                        <textarea name="Horários de Banheiro" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_potty_sched" placeholder="Ex: Early morning (6am), afternoon (2pm) and before bed (9pm)."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_potty_sig">Does the pet know how to communicate when they need to go out?</label>
                        <input type="text" name="Sinal para Banheiro" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_potty_sig" placeholder="Ex: Sits by the door and whines.">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2" data-i18n="q_trained">Is he/she fully house trained?</label>
                        <div class="flex gap-6">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="Treinado" value="Yes" data-i18n-val="v_yes" class="w-4 h-4 text-prim focus:ring-prim" required>
                                <span data-i18n="opt_yes">Yes</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="Treinado" value="No" data-i18n-val="v_no" class="w-4 h-4 text-prim focus:ring-prim">
                                <span data-i18n="opt_no">No</span>
                            </label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec4">
                    ⚕️ Medications & Health
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_meds">Does he/she take any medications or supplements?</label>
                            <input type="text" name="Medicamentos" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_meds" placeholder="Ex: Yes, pill X in the morning.">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_health">Any medical concerns I should know about?</label>
                            <input type="text" name="Preocupações Médicas" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_health" placeholder="Ex: Joint issues.">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_vet">Veterinarian Name</label>
                            <input type="text" name="Nome do Veterinário" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_vet" placeholder="Ex: Northlake Animal Hospital">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_vet_phone">Veterinarian Phone</label>
                            <input type="tel" name="Telefone do Veterinário" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_vet_phone" placeholder="(555) 555-5555">
                        </div>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-lg border border-amber-200 mt-2">
                        <label class="block text-sm font-semibold text-amber-900 mb-2" data-i18n="q_emerg">In case of emergency, do you authorize veterinary treatment?</label>
                        <div class="flex gap-6">
                            <label class="flex items-center gap-2 cursor-pointer text-amber-900">
                                <input type="radio" name="Autoriza Tratamento" value="Yes" data-i18n-val="v_yes" class="w-4 h-4 text-amber-600 focus:ring-amber-500" required>
                                <span data-i18n="opt_yes_emerg">Yes, I authorize and please contact me immediately.</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-amber-900">
                                <input type="radio" name="Autoriza Tratamento" value="No" data-i18n-val="v_no" class="w-4 h-4 text-amber-600 focus:ring-amber-500">
                                <span data-i18n="opt_no">No.</span>
                            </label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec5">
                    🦮 Walks & Behavior
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_likes_walk">Does he/she have the habit or like to walk?</label>
                            <input type="text" name="Gosta de Passear" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_likes_walk" placeholder="Ex: Yes, loves to walk.">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_walk_freq">How often does he/she usually walk?</label>
                            <input type="text" name="Frequência de Passeios" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_walk_freq" placeholder="Ex: We have a big yard, but he loves to explore.">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_leash">How is his/her behavior on a leash?</label>
                            <input type="text" name="Comportamento na Coleira" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_leash" placeholder="Ex: Pulls a little at first.">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_dogpark">Can he/she be taken to the Dog Park?</label>
                            <input type="text" name="Dog Park" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_dogpark" placeholder="Ex: We prefer not to.">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_friendly">Is he/she friendly with other people and dogs?</label>
                        <textarea name="Sociabilidade" rows="2" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_friendly" placeholder="Ex: Barks at first, but calms down later."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_chew">Does he/she chew on shoes, socks, or other objects?</label>
                            <input type="text" name="Mastiga Objetos" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_chew" placeholder="Ex: Yes, sometimes grabs socks.">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_cmds">What commands does he/she know?</label>
                            <input type="text" name="Comandos" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_cmds" placeholder="Ex: Sit, Down, Stay, Leave it...">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_fear">Any fears or triggers?</label>
                        <input type="text" name="Medos" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_fear" placeholder="Ex: Vacuum cleaner, loud noises.">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-prim border-b-2 border-sec pb-2 mb-5 flex items-center gap-2" data-i18n="sec6">
                    ❤️ Comfort & Favorites
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_items">What comfort items will you bring?</label>
                            <input type="text" name="Itens de Conforto" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_items" placeholder="Ex: Bed, crate, favorite toy.">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_love">What does he/she love most?</label>
                            <input type="text" name="Coisas Favoritas" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_love" placeholder="Ex: Belly rubs, playing fetch.">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="q_notes">Additional Notes:</label>
                        <textarea name="Notas Adicionais" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-prim focus:border-prim outline-none transition-all" data-i18n-ph="ph_notes" placeholder="Any other important details (e.g., might whine a little at drop-off)."></textarea>
                    </div>
                </div>
            </section>

            <div class="pt-4">
                <button type="submit" class="w-full bg-prim text-white font-bold text-lg py-4 px-6 rounded-xl shadow-lg hover:bg-primDark hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex justify-center items-center gap-2">
                    <span data-i18n="btn_submit">Submit Pet Information</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </form>
    </div>

                ph_friendly: "Ex: Barks at first, but calms down later.",
                ph_chew: "Ex: Yes, sometimes grabs socks.",
                ph_cmds: "Ex: Sit, Down, Stay, Leave it...",
                ph_fear: "Ex: Vacuum cleaner, loud noises.",
                ph_items: "Ex: Bed, crate, favorite toy.",
                ph_love: "Ex: Belly rubs, playing fetch.",
                ph_notes: "Any other important details (e.g., might whine a little at drop-off).",
                
                // Options and values
                opt_yes: "Yes",
                opt_no: "No",
                opt_yes_emerg: "Yes, I authorize and please contact me immediately.",
                v_yes: "Yes",
                v_no: "No",
                subject: "New Pet Information Sheet Filled! 🐾",
                btn_submit: "Submit Pet Information"
            }
        };

        function changeLanguage(lang) {
            // Atualizar botões visuais
            document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            // Alterar o idioma principal da página HTML
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';

            // Traduzir textos puros (Labels, Titulos, Spans)
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang][key]) el.innerText = translations[lang][key];
            });

            // Traduzir Placeholders (Exemplos dentro das caixas)
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if(translations[lang][key]) el.placeholder = translations[lang][key];
            });

            // Traduzir Valores Ocultos (Respostas do rádio)
            // OBS: Deixei a tradução dos valores do rádio ativa, pois fica bonito no email da Emma chegar 'Yes' em vez de 'Sim'.
            document.querySelectorAll('[data-i18n-val]').forEach(el => {
                const key = el.getAttribute('data-i18n-val');
                if(translations[lang][key]) el.value = translations[lang][key];
            });
        }
    </script>
</body>
</html>
